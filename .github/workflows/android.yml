name: Android

# push、PR：建置並跑單元測試
# 推 v* tag：用正式金鑰簽章（附 debug → 正式金鑰的輪替證明，見 tools/sign_release.sh），建立 GitHub Release 並附上 APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 版本號用 git describe 與 commit 數

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 還原 debug 金鑰（舊金鑰，輪替證明的起點）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

      - name: 建置與測試
        run: ./gradlew assembleRelease testReleaseUnitTest
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: 正式簽章
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore" DEBUG_KEYSTORE="$SIGNING_KEYSTORE" \
            tools/sign_release.sh app/build/outputs/apk/release/app-release.apk "ScorpioIME-${GITHUB_REF_NAME}.apk"
          rm -f "$RUNNER_TEMP/release.keystore"
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}

      - name: 發佈 Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          T=${GITHUB_REF_NAME}
          if gh release view "$T" > /dev/null 2>&1; then
            gh release upload "$T" "ScorpioIME-$T.apk" --clobber
          else
            gh release create "$T" "ScorpioIME-$T.apk" --title "Scorpio 智慧注音 ${T#v}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
